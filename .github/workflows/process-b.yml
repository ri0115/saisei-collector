name: Process B-priority price queue

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refine QC with line-level parsing and OCR"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: "regen-b-price-scan"
  cancel-in-progress: false

jobs:
  process:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure checkpoint commits
        run: |
          git config user.name "regen-med-collector"
          git config user.email "actions@users.noreply.github.com"

      - name: Process all B-priority plans
        shell: bash
        run: |
          set -e
          for chunk in $(seq 1 15); do
            echo "===== B chunk $chunk ====="
            git pull --rebase origin main
            python scripts/processor.py \
              --queue data/queue_b_v40.json \
              --state results/b_state.json \
              --results results/b_latest.json \
              --csv results/b_prices.csv \
              --index-cache results/index_cache.json \
              --max-items 24 \
              --workers 8

            git add results/b_state.json results/b_latest.json results/b_prices.csv || true
            if ! git diff --cached --quiet; then
              git commit -m "B collector checkpoint $chunk [skip ci]"
              git pull --rebase origin main
              git push
            fi

            PENDING=$(python - <<'PY'
          import json
          with open("results/b_state.json",encoding="utf-8") as f:
              print(json.load(f).get("pending",0))
          PY
            )
            echo "B pending=$PENDING"
            if [ "$PENDING" = "0" ]; then
              break
            fi
            sleep 5
          done
