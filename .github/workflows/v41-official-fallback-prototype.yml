name: Prototype v41 official-site fallback

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/official_site_fallback_v41.py"
      - ".github/workflows/v41-official-fallback-prototype.yml"

permissions:
  contents: write

jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pymupdf
      - name: Run five-facility prototype
        run: |
          python scripts/official_site_fallback_v41.py             --max-facilities 5             --output results/v41_official_fallback_prototype.json             --csv results/v41_official_fallback_prototype.csv
      - name: Commit prototype outputs
        run: |
          git config user.name "regen-med-collector"
          git config user.email "actions@users.noreply.github.com"
          git add results/v41_official_fallback_prototype.json results/v41_official_fallback_prototype.csv
          if ! git diff --cached --quiet; then
            git commit -m "Prototype v41 official-site fallback [skip ci]"
            git pull --rebase origin main
            git push
          fi
