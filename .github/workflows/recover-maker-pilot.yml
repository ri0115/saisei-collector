name: Recover maker pilot

on:
  push:
    paths:
      - "scripts/recover_maker_pilot.py"
      - ".github/workflows/recover-maker-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 pypdf lxml
      - run: python scripts/recover_maker_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: maker-pilot50
          path: results/maker_pilot/
          if-no-files-found: error
          retention-days: 7
