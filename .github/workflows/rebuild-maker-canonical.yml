name: Rebuild canonical maker snapshot
on:
  push:
    paths:
      - "scripts/rebuild_maker_canonical.py"
      - "data/product_manufacturer_registry.json"
      - "results/v42_maker_manual_verified_additions.tsv"
      - "results/v42_maker_recovery_full366.tsv"
      - "results/maker_locator_crossmatch/matches.tsv"
      - "results/v42_v40_price_stage_*_batch*.tsv"
      - "results/v42_price_merge_stage_batch*.tsv"
      - ".github/workflows/rebuild-maker-canonical.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/rebuild_maker_canonical.py
      - name: Commit canonical rebuild
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/maker_canonical_rebuild
          git diff --cached --quiet || git commit -m "Rebuild canonical manufacturer snapshot"
          git pull --rebase
          git push
