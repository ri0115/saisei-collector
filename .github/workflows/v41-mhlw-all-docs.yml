name: Scan v41 MHLW additional documents

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/v41_mhlw_all_docs_fallback.py"
      - ".github/workflows/v41-mhlw-all-docs.yml"

permissions:
  contents: write

concurrency:
  group: "regen-v41-mhlw-all-docs"
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pymupdf
      - name: Scan MHLW plan documents 0-3
        run: |
          python scripts/v41_mhlw_all_docs_fallback.py             --workers 8             --max-doc-index 3
      - name: Commit scan results
        run: |
          git config user.name "regen-med-collector"
          git config user.email "actions@users.noreply.github.com"
          git add results/v41_mhlw_all_docs_fallback.json results/v41_mhlw_all_docs_fallback.csv
          if ! git diff --cached --quiet; then
            git commit -m "Scan additional MHLW docs for v41 prices [skip ci]"
            git pull --rebase origin main
            git push
          fi
