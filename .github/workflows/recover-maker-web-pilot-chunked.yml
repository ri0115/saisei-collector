name: Recover maker web pilot chunked

on:
  push:
    paths:
      - "scripts/recover_maker_web_pilot_chunked.py"
      - ".github/workflows/recover-maker-web-pilot-chunked.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 ddgs
      - run: python scripts/recover_maker_web_pilot_chunked.py --batch ${{ matrix.batch }} --size 12
      - uses: actions/upload-artifact@v4
        with:
          name: maker-web-pilot-batch-${{ matrix.batch }}
          path: results/maker_web_pilot_chunked/batch*/
          if-no-files-found: error
          retention-days: 7
