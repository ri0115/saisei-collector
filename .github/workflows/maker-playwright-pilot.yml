name: Maker Playwright pilot

on:
  push:
    paths:
      - "scripts/recover_maker_playwright.py"
      - ".github/workflows/maker-playwright-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        batch: [0,1,2,3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright pypdf
      - run: playwright install --with-deps chromium
      - run: python scripts/recover_maker_playwright.py --batch ${{ matrix.batch }} --size 12
      - uses: actions/upload-artifact@v4
        with:
          name: maker-playwright-pilot-${{ matrix.batch }}
          path: results/maker_playwright_pilot/
          if-no-files-found: error
          retention-days: 7
