name: Audit manufacturer locator matches
on:
  push:
    paths:
      - "scripts/audit_manufacturer_locator_matches.py"
      - ".github/workflows/audit-manufacturer-locator-matches.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_manufacturer_locator_matches.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/maker_locator_crossmatch/audited_new.tsv results/maker_locator_crossmatch/audited_summary.json
          git diff --cached --quiet || git commit -m "Audit manufacturer locator matches"
          git pull --rebase
          git push
