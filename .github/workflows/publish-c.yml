name: Publish C results to main

on:
  workflow_run:
    workflows: ["Rescue C exception PDFs"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Import C results from isolated branch
        run: |
          git fetch origin collector-c
          git show origin/collector-c:results/c_state.json > results/c_state.json
          git show origin/collector-c:results/c_latest.json > results/c_latest.json
          git show origin/collector-c:results/c_prices.csv > results/c_prices.csv
      - name: Commit published C results
        run: |
          git config user.name "regen-med-collector"
          git config user.email "actions@users.noreply.github.com"
          git add results/c_state.json results/c_latest.json results/c_prices.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish final C collector results [skip ci]"
            for try in 1 2 3 4 5; do
              git pull --rebase origin main && git push && exit 0
              sleep $((try*3))
            done
            exit 1
          fi
