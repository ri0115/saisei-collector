name: Crawl v41 official-site seeds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/v41_official_url_seeds.json"
      - "scripts/crawl_v41_official_seeds.py"
      - ".github/workflows/crawl-v41-official-seeds.yml"

permissions:
  contents: write

concurrency:
  group: "regen-v41-official-seed-crawl"
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Crawl verified official sites
        run: python scripts/crawl_v41_official_seeds.py
      - name: Commit crawl results
        run: |
          git config user.name "regen-med-collector"
          git config user.email "actions@users.noreply.github.com"
          git add results/v41_official_seed_crawl.json
          if ! git diff --cached --quiet; then
            git commit -m "Crawl verified v41 official sites [skip ci]"
            git pull --rebase origin main
            git push
          fi
