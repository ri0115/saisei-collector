name: MHLW requests warmup probe

on:
  push:
    paths:
      - "scripts/test_mhlw_requests_warmup.py"
      - ".github/workflows/mhlw-requests-warmup-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/test_mhlw_requests_warmup.py
      - uses: actions/upload-artifact@v4
        with:
          name: mhlw-requests-warmup-probe
          path: results/mhlw_requests_warmup_probe.json
          retention-days: 7
