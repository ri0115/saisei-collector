name: Recover maker committee pilot

on:
  push:
    paths:
      - "scripts/recover_maker_committee_pilot.py"
      - ".github/workflows/recover-maker-committee-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python scripts/recover_maker_committee_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: maker-committee-pilot
          path: results/maker_committee_pilot/
          if-no-files-found: error
          retention-days: 7
