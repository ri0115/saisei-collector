name: Fast text rescue v41 MHLW prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fast_text_rescue_v41.py"
      - ".github/workflows/fast-text-rescue-v41.yml"

permissions:
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests pymupdf
      - name: Run text-only rescue
        run: python scripts/fast_text_rescue_v41.py
      - name: Commit audit output
        run: |
          git config user.name "regen-med-collector"
          git config user.email "actions@users.noreply.github.com"
          git add results/v41_fast_text_rescue.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit v41 fallback with fast text rescue [skip ci]"
            git pull --rebase origin main
            git push
          fi
