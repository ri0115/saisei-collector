name: MHLW Playwright probe

on:
  push:
    paths:
      - "scripts/test_mhlw_playwright.py"
      - ".github/workflows/mhlw-playwright-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/test_mhlw_playwright.py
      - name: Commit probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/mhlw_playwright_probe.json
          git diff --cached --quiet || git commit -m "Probe MHLW via Playwright"
          git push
