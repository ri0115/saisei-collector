name: Publish A rescued results

on:
  workflow_run:
    workflows: ["Rescue A exception PDFs"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Import A rescue results
        run: |
          git fetch origin collector-a-rescue
          git show origin/collector-a-rescue:results/state.json > results/state.json
          git show origin/collector-a-rescue:results/latest.json > results/latest.json
          git show origin/collector-a-rescue:results/prices.csv > results/prices.csv
      - name: Commit A rescue results
        run: |
          git config user.name "regen-med-collector"
          git config user.email "actions@users.noreply.github.com"
          git add results/state.json results/latest.json results/prices.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish rescued A results [skip ci]"
            for try in 1 2 3 4 5; do
              git pull --rebase origin main && git push && exit 0
              sleep $((try*3))
            done
            exit 1
          fi
