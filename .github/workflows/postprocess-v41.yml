name: Postprocess v41 price QC

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Import v41 deep rescue prices"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/postprocess_v41_prices.py"
      - "data/v41_verified_price_overrides.json"
      - "data/v41_official_price_overrides.json"
      - "data/v41_scope_exclusions.json"
      - "data/v41_no_public_price_overrides.json"
      - ".github/workflows/postprocess-v41.yml"

permissions:
  contents: write

concurrency:
  group: "regen-v41-postprocess"
  cancel-in-progress: false

jobs:
  postprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Normalize price candidates and resolve safe QC
        run: python scripts/postprocess_v41_prices.py
      - name: Verify postprocess integrity
        run: |
          python - <<'PY'
          import json
          s=json.load(open("results/v41_additions_postprocess_summary.json",encoding="utf-8"))
          assert s["total"]==774
          assert s["normalized_fail"]==0
          assert s["normalized_auto"]+s["normalized_qc"]+s.get("normalized_no_public_price",0)+s.get("normalized_out_of_scope",0)==774
          print(s)
          PY
      - name: Commit normalized outputs
        run: |
          git config user.name "regen-med-collector"
          git config user.email "actions@users.noreply.github.com"
          git add results/v41_additions_normalized.json results/v41_additions_postprocess_summary.json results/v41_additions_prices_normalized.csv results/v41_official_site_fallback_queue.json results/v41_complex_price_review_queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Postprocess v41 price QC [skip ci]"
            git pull --rebase origin main
            git push
          fi
