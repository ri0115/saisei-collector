name: Force-cancel stalled A QC run

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/force-cancel-a-qc.yml"

permissions:
  actions: write
  contents: read

jobs:
  force-cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel stalled workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/ri0115/saisei-collector/actions/runs/35331022887/force-cancel || true
          echo "Requested force-cancel of stalled run 35331022887"
