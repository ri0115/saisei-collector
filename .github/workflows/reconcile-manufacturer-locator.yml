name: Reconcile manufacturer locator
on:
  push:
    paths:
      - "scripts/reconcile_manufacturer_locator.py"
      - ".github/workflows/reconcile-manufacturer-locator.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/reconcile_manufacturer_locator.py
      - name: Commit reconciled outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/maker_locator_reconciled
          git diff --cached --quiet || git commit -m "Reconcile manufacturer locator candidates"
          git pull --rebase
          git push
