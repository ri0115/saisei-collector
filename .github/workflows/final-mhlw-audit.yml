name: Final MHLW reconciliation audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/final_mhlw_audit.py"
      - "scripts/refine_mhlw_audit.py"
      - ".github/workflows/final-mhlw-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run final reconciliation
        run: python scripts/final_mhlw_audit.py
      - name: Refine high-confidence candidates
        run: python scripts/refine_mhlw_audit.py
      - name: Commit audit outputs
        run: |
          git config user.name "regen-med-collector"
          git config user.email "actions@users.noreply.github.com"
          git add results/mhlw_final_audit.json results/mhlw_final_audit_candidates.csv results/mhlw_final_audit_refined.json results/mhlw_high_confidence_missing.csv
          if ! git diff --cached --quiet; then
            git commit -m "Final MHLW reconciliation audit [skip ci]"
            git pull --rebase origin main
            git push
          fi
