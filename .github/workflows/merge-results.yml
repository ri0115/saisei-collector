name: Merge A B C collector results

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish A rescued results", "Rescue B exception PDFs", "Publish C results to main"]
    types: [completed]

permissions:
  contents: write

jobs:
  merge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check all lanes are finalized
        id: ready
        shell: bash
        run: |
          READY=$(python - <<'PY'
          import json
          files=["results/state.json","results/b_state.json","results/c_state.json"]
          vals=[]
          for p in files:
              try:
                  with open(p,encoding="utf-8") as f:
                      vals.append(int(json.load(f).get("qc_refine_remaining",999)))
              except Exception:
                  vals.append(999)
          print("yes" if vals==[0,0,0] else "no")
          print("remaining="+",".join(map(str,vals)),file=open("/tmp/remaining","w"))
          PY
          )
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          cat /tmp/remaining

      - name: Merge collector results
        if: steps.ready.outputs.ready == 'yes'
        run: python scripts/merge_results.py
      - name: Commit merged outputs
        if: steps.ready.outputs.ready == 'yes'
        run: |
          git config user.name "regen-med-collector"
          git config user.email "actions@users.noreply.github.com"
          git add results/all_latest.json results/all_summary.json results/all_prices.csv
          if ! git diff --cached --quiet; then
            git commit -m "Merge A B C collector results [skip ci]"
            git pull --rebase origin main
            git push
          fi
