name: Manufacturer locator crossmatch
on:
  push:
    paths:
      - "scripts/crossmatch_manufacturer_locators.py"
      - ".github/workflows/manufacturer-locator-crossmatch.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crossmatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/crossmatch_manufacturer_locators.py
      - name: Commit candidate outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add results/maker_locator_crossmatch
          git diff --cached --quiet || git commit -m "Crossmatch manufacturer facility locators"
          git push
