<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111315">
<title>REGEN MED COLLECTOR</title>
<style>
:root{--bg:#0f1113;--panel:#171a1e;--line:#30363d;--txt:#f3f4f6;--muted:#9aa4af;--ok:#79d7a5;--warn:#f5c56b;--bad:#ee8585}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:760px;margin:auto;padding:24px 14px 110px}.eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted)}
h1{font-size:24px;margin:5px 0 18px}p{color:var(--muted);font-size:13px;line-height:1.65}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px}
.kpi b{display:block;font-size:22px}.kpi span{font-size:9px;color:var(--muted)}.progress{margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.bar{height:7px;background:#292e34;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#f2f4f5;transition:.25s}.pt{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.btn{border:1px solid var(--line);background:#1d2126;color:#fff;border-radius:13px;padding:13px;font-weight:700;font-size:14px}.primary{background:#eef1f3;color:#111;border-color:#eef1f3}.btn:disabled{opacity:.5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.top{display:flex;justify-content:space-between;gap:8px}.id{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.name{font-size:14px;font-weight:750;margin-top:3px}.tr{font-size:11px;color:var(--muted);line-height:1.5;margin-top:5px}.sum{font-size:12px;line-height:1.55;margin-top:8px;padding-top:8px;border-top:1px solid #292e34}
.status{font-size:10px;font-weight:800;border-radius:99px;padding:5px 8px;background:#252a30;color:var(--muted);height:max-content}.status.auto{color:var(--ok);background:rgba(121,215,165,.12)}.status.qc{color:var(--warn);background:rgba(245,197,107,.12)}.status.fail{color:var(--bad);background:rgba(238,133,133,.12)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip{font-size:9px;border:1px solid #343b43;border-radius:99px;padding:4px 6px;color:#b4bec8}.qc{font-size:10px;color:var(--warn);margin-top:7px;line-height:1.5}
h2{font-size:12px;letter-spacing:.08em;margin:20px 2px 8px}.log{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;min-height:70px;color:#aeb7c0}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,19,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.bi{max-width:760px;margin:auto;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:7px}.small{font-size:12px;padding:11px 7px}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div class="eyebrow">ORTHOPEDIC REGENERATIVE MEDICINE</div>
<h1>REGEN MED COLLECTOR <span style="font-size:11px;color:#9aa4af">v0.3</span></h1>
<p>山梨A 7計画を使った動作確認版です。ボタンを押すと5件をAUTO、2件をQCへ振り分け、v40の15価格レコードを再現します。</p>
<div class="kpis">
<div class="kpi"><b id="q">7</b><span>QUEUE</span></div>
<div class="kpi"><b id="a">0</b><span>AUTO</span></div>
<div class="kpi"><b id="c">0</b><span>QC</span></div>
<div class="kpi"><b id="f">0</b><span>FAILED</span></div>
</div>
<div class="progress"><div class="pt"><span id="pl">未処理</span><span id="pp">0%</span></div><div class="bar"><div id="fill" class="fill"></div></div></div>
<div class="actions"><button id="run" class="btn primary">山梨7件を一括処理</button><button id="reset" class="btn">リセット</button></div>
<h2>QUEUE / RESULT</h2><div id="list"></div>
<h2>LOG</h2><div id="log" class="log">ready.</div>
</main>
<div class="bottom"><div class="bi"><button id="run2" class="btn primary small">処理</button><button id="csv" class="btn small">CSV</button><button id="json" class="btn small">JSON</button></div></div>
<script>
(function(){
var plans=[
{id:'P00647',fid:'F0458',name:'みわペイン痛みのクリニック',type:'第二種',tr:'多血小板血漿（PRP）による変形性関節症治療',st:'auto',sum:'150,000円（税別、採血＋投与3回分）',n:1,src:'MHLW',prices:[150000]},
{id:'P00742',fid:'F0522',name:'山梨県立中央病院',type:'第三種',tr:'自己多血小板血漿（PRP）を用いた筋・腱・靭帯等の軟部組織再生治療',st:'auto',sum:'基本治療費12,650円／採血10mL追加+8,800円／局所注射1回追加+220円',n:1,src:'MHLW',prices:[12650]},
{id:'P00743',fid:'F0459',name:'市立甲府病院',type:'第三種',tr:'PRPによる筋・腱・靭帯損傷治療',st:'qc',sum:'筋・腱・靭帯への注入 1回100,000円（税別）',n:1,src:'施設公式',qc:'MHLW PDF本文抽出不安定。現行届出照合後に病院公式料金で補完。',prices:[100000]},
{id:'P00648',fid:'F0459',name:'市立甲府病院',type:'第二種',tr:'PRPの投与による変形性関節症治療',st:'qc',sum:'関節腔内への注入 1回257,000円（税別）',n:1,src:'施設公式',qc:'MHLW PDF本文抽出不安定。現行届出照合後に病院公式料金で補完。',prices:[257000]},
{id:'P00649',fid:'F0163',name:'東甲府医院',type:'第二種',tr:'変形性関節症に対するPRP関節内投与療法',st:'auto',sum:'施術料300,000円（税込）',n:1,src:'MHLW',prices:[300000]},
{id:'P00650',fid:'F0162',name:'JCHO 山梨病院',type:'第二種',tr:'PRPを用いた変形性関節症治療',st:'auto',sum:'GPS III 100,000円／APS 260,000円（税別）',n:2,src:'MHLW',prices:[100000,260000]},
{id:'P00651',fid:'F0164',name:'加納岩総合病院',type:'第二種',tr:'変形性関節症等への自家PRP注入療法',st:'auto',sum:'APS／TriCeLL／ACPを片側・両側・一般・学生で条件分解',n:8,src:'MHLW',prices:[330000,330000,88000,52800,55000,33000,99000,59400]}
];
var state=plans.map(function(x){var y=Object.assign({},x);y.status='pending';return y}),running=false;
function el(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function log(s){el('log').textContent+='\n'+new Date().toLocaleTimeString('ja-JP')+'  '+s}
function render(){
var done=state.filter(function(x){return x.status==='auto'||x.status==='qc'||x.status==='fail'}).length;
var aa=state.filter(function(x){return x.status==='auto'}).length,cc=state.filter(function(x){return x.status==='qc'}).length,ff=state.filter(function(x){return x.status==='fail'}).length;
el('q').textContent=state.length-done;el('a').textContent=aa;el('c').textContent=cc;el('f').textContent=ff;
var pct=Math.round(done/state.length*100);el('fill').style.width=pct+'%';el('pp').textContent=pct+'%';el('pl').textContent=done?done+'/'+state.length+' 処理済み':'未処理';
el('list').innerHTML=state.map(function(p){
var label={pending:'WAIT',running:'RUN',auto:'AUTO',qc:'QC',fail:'FAIL'}[p.status];
var extra='';
if(p.status==='auto'||p.status==='qc'||p.status==='fail'){
  extra='<div class="sum">'+esc(p.sum)+'</div><div class="chips"><span class="chip">'+esc(p.src)+'</span><span class="chip">'+p.n+' price'+(p.n>1?'s':'')+'</span></div>';
  if(p.qc){ extra+='<div class="qc">QC: '+esc(p.qc)+'</div>'; }
}
return '<div class="card"><div class="top"><div><div class="id">'+p.id+' · '+p.fid+'</div><div class="name">'+esc(p.name)+'</div></div><span class="status '+p.status+'">'+label+'</span></div><div class="tr">'+esc(p.type)+' · '+esc(p.tr)+'</div>'+extra+'</div>';
}).join('');
el('run').disabled=running;el('run2').disabled=running;
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function run(){
if(running)return;
running=true;
state=plans.map(function(x){var y=Object.assign({},x);y.status='pending';return y});
el('log').textContent='ready.\n開始';
render();
for(var i=0;i<state.length;i++){
  state[i].status='running';
  render();
  log(state[i].id+' source check');
  await sleep(250);
  state[i].status=state[i].st;
  log(state[i].id+' → '+state[i].status.toUpperCase()+' / '+state[i].n+' price record(s)');
  render();
}
running=false;
log('complete: 5 AUTO / 2 QC / 0 FAIL / 15 price records');
render();
}
function reset(){running=false;state=plans.map(function(x){var y=Object.assign({},x);y.status='pending';return y});el('log').textContent='ready.';render()}
function rows(){var out=[];state.forEach(function(p){p.prices.forEach(function(v,i){out.push({plan_id:p.id,facility_id:p.fid,facility:p.name,type:p.type,status:p.status,source:p.src,price:v,price_index:i+1})})});return out}
function dl(name,text,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},400)}
function csv(){var r=rows(),k=['plan_id','facility_id','facility','type','status','source','price','price_index'];var lines=[k.join(',')];r.forEach(function(x){lines.push(k.map(function(z){return '"'+String(x[z]).replace(/"/g,'""')+'"'}).join(','))});dl('saisei_yamanashi_demo.csv','\ufeff'+lines.join('\n'),'text/csv;charset=utf-8')}
function json(){dl('saisei_yamanashi_demo.json',JSON.stringify({results:state},null,2),'application/json')}
el('run').onclick=run;el('run2').onclick=run;el('reset').onclick=reset;el('csv').onclick=csv;el('json').onclick=json;render();
})();
</script>
</body></html>
