<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1113"><title>REGEN MED COLLECTOR</title>
<style>
:root{--bg:#0f1113;--p:#171a1e;--l:#30363d;--t:#f3f4f6;--m:#9aa4af;--ok:#79d7a5;--w:#f5c56b;--bad:#ee8585}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:820px;margin:auto;padding:25px 14px 115px}.e{font-size:10px;letter-spacing:.18em;color:var(--m)}h1{font-size:25px;margin:6px 0 10px}
.sub{font-size:12px;line-height:1.65;color:var(--m);margin-bottom:14px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0 12px}.tab{border:1px solid var(--l);background:#1d2126;color:#fff;border-radius:12px;padding:11px 5px;font-weight:750}.tab.active{background:#eef1f3;color:#111}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.k>div,.panel,.card{background:var(--p);border:1px solid var(--l);border-radius:14px}.k>div{padding:12px}.k b{font-size:24px;display:block}.k span{font-size:9px;color:var(--m)}
.panel{padding:12px;margin:10px 0}.r{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{font-size:10px;color:var(--m)}
.bar{height:8px;background:#292e34;border-radius:99px;overflow:hidden;margin-top:10px}.fill{height:100%;background:#f2f4f5;width:0;transition:.3s}
.phase{font-size:11px;font-weight:750}.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 12px var(--ok)}
h2{font-size:12px;letter-spacing:.08em;margin:21px 2px 8px}.card{padding:12px;margin:7px 0}.id{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--m)}
.name{font-size:14px;font-weight:750;margin:4px 0}.tr{font-size:11px;color:var(--m);line-height:1.45}.price{font-size:12px;border-top:1px solid #292e34;margin-top:8px;padding-top:8px}
.badge{font-size:9px;font-weight:800;border-radius:99px;padding:5px 8px}.AUTO{color:var(--ok);background:rgba(121,215,165,.12)}.QC{color:var(--w);background:rgba(245,197,107,.12)}.FAIL{color:var(--bad);background:rgba(238,133,133,.12)}
.err{font-size:10px;color:var(--bad);margin-top:6px}.btns{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,19,.92);backdrop-filter:blur(16px);border-top:1px solid var(--l);padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.bi{max-width:820px;margin:auto;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:7px}.btn{border:1px solid var(--l);background:#1d2126;color:#fff;border-radius:13px;padding:12px;font-weight:700;text-align:center;text-decoration:none;font-size:12px}.primary{background:#eef1f3;color:#111;border-color:#eef1f3}
@media(max-width:520px){.k{grid-template-columns:repeat(2,1fr)}} 
</style></head><body><main>
<div class="e">ORTHOPEDIC REGENERATIVE MEDICINE</div>
<h1>REGEN MED COLLECTOR <span style="font-size:11px;color:#9aa4af">v0.8</span></h1>
<div class="sub">大量処理モード。A/B/C優先キューを切り替えて進捗を確認できます。A→B→Cを自動連結して処理します。</div>
<div class="tabs"><button class="tab active" id="tabA">A PRIORITY</button><button class="tab" id="tabB">B PRIORITY</button><button class="tab" id="tabC">C PRIORITY</button></div>
<div class="k">
<div><b id="processed">0</b><span id="processedLabel">PROCESSED</span></div><div><b id="pending">0</b><span>PENDING</span></div>
<div><b id="auto">0</b><span>AUTO</span></div><div><b id="qc">0</b><span>QC</span></div>
<div><b id="fail">0</b><span>FAILED</span></div><div><b id="pct">0%</b><span>PROGRESS</span></div>
</div>
<div class="panel"><div class="r"><div class="phase"><span class="live"></span><span id="phase">LOADING</span></div><div class="small" id="updated">-</div></div><div class="bar"><div id="fill" class="fill"></div></div></div>
<h2>RECENT RESULTS</h2><div id="list"><div class="card small">読み込み中です。</div></div>
</main>
<div class="btns"><div class="bi"><button class="btn primary" id="refresh">更新</button><a class="btn" id="csv" target="_blank">CSV</a><a class="btn" id="json" target="_blank">JSON</a></div></div>
<script>
(function(){
const RAW='https://raw.githubusercontent.com/ri0115/saisei-collector/main/';
let lane='A';
const e=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const files=()=>{
 if(lane==='A') return {state:'results/state.json',latest:'results/latest.json',csv:'results/prices.csv',total:216,wait:'A優先の結果待ちです。'};
 if(lane==='B') return {state:'results/b_state.json',latest:'results/b_latest.json',csv:'results/b_prices.csv',total:335,wait:'B優先はAのQC完了後に自動開始します。'};
 return {state:'results/c_state.json',latest:'results/c_latest.json',csv:'results/c_prices.csv',total:105,wait:'C優先はB完了後に自動開始します。'};
};
function amounts(x){const p=x.prices||[];if(!p.length)return '価格候補なし';return p.slice(0,4).map(v=>Number(v.amount).toLocaleString('ja-JP')+'円'+(v.tax&&v.tax!=='不明'?' / '+v.tax:'')).join(' ・ ')+(p.length>4?' ほか'+(p.length-4)+'件':'')}
function setLane(x){
 lane=x;
 ['A','B','C'].forEach(v=>e('tab'+v).classList.toggle('active',x===v));
 load();
}
async function load(){
 try{
  const f=files(),t=Date.now();
  const [sr,lr]=await Promise.all([fetch(RAW+f.state+'?t='+t,{cache:'no-store'}),fetch(RAW+f.latest+'?t='+t,{cache:'no-store'})]);
  if(!sr.ok||!lr.ok)throw new Error('fetch failed');
  const s=await sr.json(),l=await lr.json(),total=s.total||f.total,done=s.processed||0,pct=Math.round(done/total*100);
  e('processed').textContent=done;e('processedLabel').textContent='PROCESSED / '+total;e('pending').textContent=s.pending??(total-done);e('auto').textContent=s.auto||0;e('qc').textContent=s.qc||0;e('fail').textContent=s.fail||0;e('pct').textContent=pct+'%';e('fill').style.width=pct+'%';
  e('phase').textContent=String(s.phase||'queued').replaceAll('_',' ').toUpperCase();e('updated').textContent=s.updated_at?new Date(s.updated_at).toLocaleString('ja-JP'):'-';
  const items=(l.items||[]).slice(-30).reverse();
  e('list').innerHTML=items.length?items.map(x=>'<div class="card"><div class="r"><div><div class="id">'+esc(x.plan_id)+' · '+esc(x.prefecture)+'</div><div class="name">'+esc(x.facility)+'</div></div><span class="badge '+esc(x.status)+'">'+esc(x.status)+'</span></div><div class="tr">'+esc(x.category)+' · '+esc(x.treatment)+'</div><div class="price">'+esc(amounts(x))+'</div>'+(x.error?'<div class="err">'+esc(x.error)+'</div>':'')+'</div>').join(''):'<div class="card small">'+f.wait+'</div>';
  e('csv').href=RAW+f.csv;e('json').href=RAW+f.latest;
 }catch(err){e('phase').textContent='WAIT / RETRY'}
}
e('tabA').onclick=()=>setLane('A');e('tabB').onclick=()=>setLane('B');e('tabC').onclick=()=>setLane('C');e('refresh').onclick=load;load();setInterval(load,15000);
})();
</script></body></html>
